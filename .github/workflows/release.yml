name: Release

on:
  workflow_run:
    workflows: [navmap-pathfinder]
    types: [completed]

permissions:
  actions: read
  contents: write

concurrency:
  group: version-publishing
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Read package version
        id: version
        shell: bash
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')"
          tag="v${version}"

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

          if git rev-parse --quiet --verify "refs/tags/${tag}" >/dev/null; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "${tag} already exists; nothing to publish."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Publishing ${tag}."
          fi

      - name: Download Windows 32-bit artifact
        if: steps.version.outputs.publish == 'true'
        uses: actions/download-artifact@v6
        with:
          name: Windows Build
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          path: ./artifacts/windows

      - name: Download Linux 32-bit artifact
        if: steps.version.outputs.publish == 'true'
        uses: actions/download-artifact@v6
        with:
          name: Linux Build
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          path: ./artifacts/linux

      - name: Download Windows 64-bit artifact
        if: steps.version.outputs.publish == 'true'
        uses: actions/download-artifact@v6
        with:
          name: Windows Build x64
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          path: ./artifacts/windows-x64

      - name: Download Linux 64-bit artifact
        if: steps.version.outputs.publish == 'true'
        uses: actions/download-artifact@v6
        with:
          name: Linux Build x64
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          path: ./artifacts/linux-x64

      - name: Publish release
        if: steps.version.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.event.workflow_run.head_sha }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
          fail_on_unmatched_files: true
          files: |
            ./artifacts/windows/i686-pc-windows-msvc/release/navmap_pathfinder.dll
            ./artifacts/windows/i686-pc-windows-msvc/release/navmap_pathfinder.pdb
            ./artifacts/windows-x64/x86_64-pc-windows-msvc/release/navmap_pathfinder64.dll
            ./artifacts/windows-x64/x86_64-pc-windows-msvc/release/navmap_pathfinder64.pdb
            ./artifacts/linux/i686-unknown-linux-gnu/release/libnavmap_pathfinder.so
            ./artifacts/linux-x64/x86_64-unknown-linux-gnu/release/libnavmap_pathfinder64.so
            ./artifacts/windows/navmap_pathfinder.dm
